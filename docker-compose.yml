services:
  dikte-web:
    image: "${DIKTE_IMAGE:-ghcr.io/eco-null/dictation-web:latest}"
    pull_policy: always
    container_name: dikte-web
    restart: unless-stopped
    ports:
      - "${DIKTE_BIND_ADDRESS:-127.0.0.1}:${DIKTE_PORT:-8245}:8000"
    environment:
      DIKTE_WEB_PASSWORD: "${DIKTE_WEB_PASSWORD:-}"
      DIKTE_COOKIE_SECURE: "${DIKTE_COOKIE_SECURE:-1}"
      DIKTE_MAX_UPLOAD: "${DIKTE_MAX_UPLOAD:-1073741824}"
      XDG_CONFIG_HOME: /data/config
      XDG_DATA_HOME: /data/share
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${DIKTE_DATA_DIR:-/DATA/AppData/dikte-web}:/data"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dikte_data:
