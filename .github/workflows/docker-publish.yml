name: Build and publish Docker image

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Run application tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ghcr.io/${{ github.repository_owner }}/dikte-web
          flavor: latest=false
          tags: |
            type=sha,prefix=,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=Dictation Web

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: |
            dictation-web:smoke
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify the Compose deployment
        env:
          DIKTE_IMAGE: dictation-web:smoke
          DIKTE_DATA_DIR: dikte_data
          DIKTE_PORT: '18245'
          DIKTE_COOKIE_SECURE: '0'
        run: |
          trap 'docker compose down --volumes' EXIT
          docker compose up -d --pull never --wait --wait-timeout 60
          docker compose exec -T dikte-web test -s /app/LICENSE
          docker compose exec -T dikte-web ffmpeg -version
          password="$(docker compose exec -T dikte-web cat /data/share/dikte/web_password)"
          python .github/scripts/smoke_docker.py http://127.0.0.1:18245 <<< "$password"
          docker compose restart dikte-web
          docker compose up -d --pull never --wait --wait-timeout 60
          python .github/scripts/smoke_docker.py http://127.0.0.1:18245 --verify-saved <<< "$password"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the verified image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              docker push "$tag"
            fi
          done <<< "$IMAGE_TAGS"
