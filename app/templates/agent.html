{% extends "base.html" %}
{% block title %}{{ t('Assistant') }}{% endblock %}
{% block content %}
<header class="page-head"><div><h1>{{ t('Assistant') }}</h1><p>{{ t('Ask a question or refine a transcript.') }}</p></div></header>
<section class="card assistant-panel">
  <div class="chat" id="chat" role="log" aria-label="{{ t('Conversation') }}">
    <p class="empty-row" id="empty-chat">{{ t('Ask your first question to start the conversation.') }}</p>
  </div>
  <form id="agent-form" class="panel-body stack">
    <label class="field">{{ t('Question') }}<textarea name="question" rows="3" maxlength="4000" required></textarea></label>
    <details class="agent-options"><summary>{{ t('Provider and model') }}</summary>
      <div class="settings-grid">
        <label class="field">{{ t('Provider') }}
          <select name="provider">
            <option value="">{{ t('Use settings') }}</option>
            {% for value, label in providers %}<option value="{{ value }}">{{ t(label) }}</option>{% endfor %}
          </select>
        </label>
        <label class="field">{{ t('Model') }} <input name="model" placeholder="{{ t('Use settings') }}"></label>
      </div>
    </details>
    <div class="row"><button class="btn btn-primary" type="submit">{{ t('Send') }}</button><p id="stage" class="stage" role="status"></p></div>
  </form>
</section>
{% endblock %}
