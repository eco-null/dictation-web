<!doctype html>
<html lang="{{ lang() }}" data-theme="{{ ui_theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dikte{% endblock %} · Dikte Web</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/themes.css?v=1">
  <link rel="stylesheet" href="/static/app.css?v=5">
  <script id="ui-strings" type="application/json">{{ ui_strings()|tojson }}</script>
  <script src="/static/app.js?v=4" defer></script>
  {% block head %}{% endblock %}
</head>
<body class="{% if current_path == '/login' %}login-page{% else %}workspace{% endif %}">
  <a class="skip-link" href="#main">{{ t('Skip to content') }}</a>
  {% if current_path != '/login' %}
  <aside class="topbar">
    <a class="brand" href="/dictate"><span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 10v4m4-7v10m5-14v18m5-14v10m4-7v4"/></svg>
    </span><span>Dikte<span class="brand-web">Web</span></span></a>
    <nav class="nav" aria-label="{{ t('Workspace') }}">
      <a class="nav-link{% if current_path == '/dictate' or current_path.startswith('/dictate' ~ '/') %} active{% endif %}" href="/dictate"{% if current_path == '/dictate' or current_path.startswith('/dictate' ~ '/') %} aria-current="page"{% endif %}>
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 1a3 3 0 0 1 3 3v8a3 3 0 0 1-6 0V4a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
        <span class="nav-label">{{ t("Dictation") }}</span>
      </a>
      <a class="nav-link{% if current_path == '/files' or current_path.startswith('/files' ~ '/') %} active{% endif %}" href="/files"{% if current_path == '/files' or current_path.startswith('/files' ~ '/') %} aria-current="page"{% endif %}>
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span class="nav-label">{{ t("Files") }}</span>
      </a>
      <a class="nav-link{% if current_path == '/meetings' or current_path.startswith('/meetings' ~ '/') %} active{% endif %}" href="/meetings"{% if current_path == '/meetings' or current_path.startswith('/meetings' ~ '/') %} aria-current="page"{% endif %}>
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="nav-label">{{ t("Meetings") }}</span>
      </a>
      <a class="nav-link{% if current_path == '/agent' or current_path.startswith('/agent' ~ '/') %} active{% endif %}" href="/agent"{% if current_path == '/agent' or current_path.startswith('/agent' ~ '/') %} aria-current="page"{% endif %}>
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l1.9 5.7L19.6 10l-5.7 1.9L12 17.6l-1.9-5.7L4.4 10l5.7-1.9z"/><path d="M19 15l.9 2.6 2.6.9-2.6.9L19 22l-.9-2.6-2.6-.9 2.6-.9z"/></svg>
        <span class="nav-label">{{ t("Assistant") }}</span>
      </a>
      <a class="nav-link{% if current_path == '/history' or current_path.startswith('/history' ~ '/') %} active{% endif %}" href="/history"{% if current_path == '/history' or current_path.startswith('/history' ~ '/') %} aria-current="page"{% endif %}>
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span class="nav-label">{{ t("History") }}</span>
      </a>
      <a class="nav-link{% if current_path == '/settings' or current_path.startswith('/settings' ~ '/') %} active{% endif %}" href="/settings"{% if current_path == '/settings' or current_path.startswith('/settings' ~ '/') %} aria-current="page"{% endif %}>
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="nav-label">{{ t("Settings") }}</span>
      </a>
    </nav>
    <form class="logout" method="post" action="/logout">
      <button class="btn btn-ghost" type="submit">{{ t("Log out") }}</button>
    </form>
  </aside>
  {% endif %}
  <main id="main" class="container">{% block content %}{% endblock %}</main>
</body>
</html>
